<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Icônes : D doré et aile du logo (le logo complet est illisible en 16 px) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSL Air Cargo — Fret aérien et maritime Chine-Guinée</title>
    <meta
      name="description"
      content="Fret aérien et maritime de Guangzhou à Conakry : tarif au kilo transparent, suivi de vos colis et alertes WhatsApp à chaque étape. Calculez votre prix en ligne."
    />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn…). WhatsApp ignore les images en chemin relatif :
         %SITE_URL% est remplacé au build par l'adresse publique du site (voir vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DSL Air Cargo" />
    <meta property="og:title" content="DSL Air Cargo — Fret aérien et maritime Chine-Guinée" />
    <meta
      property="og:description"
      content="Fret aérien et maritime de Guangzhou à Conakry : tarif au kilo transparent, suivi de vos colis et alertes WhatsApp à chaque étape. Calculez votre prix en ligne."
    />
    <meta property="og:image" content="%SITE_URL%/images/og-dsl.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Avion cargo au crépuscule — DSL Air Cargo, de Guangzhou à Conakry" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DSL Air Cargo — Fret aérien et maritime Chine-Guinée" />
    <meta
      name="twitter:description"
      content="Fret aérien et maritime de Guangzhou à Conakry : tarif au kilo transparent, suivi de vos colis et alertes WhatsApp à chaque étape. Calculez votre prix en ligne."
    />
    <meta name="twitter:image" content="%SITE_URL%/images/og-dsl.jpg" />
    <meta name="twitter:image:alt" content="Avion cargo au crépuscule — DSL Air Cargo, de Guangzhou à Conakry" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
