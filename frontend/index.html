<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/backgrounds/dsl-logo-200.png" />
    <link rel="apple-touch-icon" href="/images/backgrounds/dsl-logo-200.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSL Air Cargo — Fret aérien Chine-Guinée</title>
    <meta
      name="description"
      content="DSL Air Cargo gère vos expéditions de Guangzhou à Conakry en temps réel : suivi de colis, tarification claire dès 160 000 GNF/kg, notifications WhatsApp et zéro frais cachés."
    />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn…)
         TODO : og:image / twitter:image sont en chemin relatif faute de domaine de prod connu.
         Dès que le site est hébergé, remplacer par une URL absolue
         (ex: https://dslaircargo.com/images/backgrounds/dsl-logo-200.png) — certains
         crawlers (WhatsApp notamment) ignorent les chemins relatifs pour ces balises. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DSL Air Cargo" />
    <meta property="og:title" content="DSL Air Cargo — Fret aérien Chine-Guinée" />
    <meta
      property="og:description"
      content="Gérez vos expéditions de Guangzhou à Conakry en temps réel. Suivi WhatsApp, tarification claire dès 160 000 GNF/kg et zéro frais cachés."
    />
    <meta property="og:image" content="/images/backgrounds/dsl-logo-200.png" />
    <meta property="og:image:width" content="200" />
    <meta property="og:image:height" content="200" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DSL Air Cargo — Fret aérien Chine-Guinée" />
    <meta
      name="twitter:description"
      content="Gérez vos expéditions de Guangzhou à Conakry en temps réel. Suivi WhatsApp, tarification claire dès 160 000 GNF/kg et zéro frais cachés."
    />
    <meta name="twitter:image" content="/images/backgrounds/dsl-logo-200.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
