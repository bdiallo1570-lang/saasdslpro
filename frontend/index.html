<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/backgrounds/dsl-logo-200.png" />
    <link rel="apple-touch-icon" href="/images/backgrounds/dsl-logo-200.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSL Air Cargo — Fret aérien et maritime Chine-Guinée</title>
    <meta
      name="description"
      content="DSL Air Cargo gère vos expéditions de Guangzhou à Conakry en temps réel : suivi de colis, tarif fixe et transparent au kilo, notifications WhatsApp et zéro frais cachés."
    />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn…). WhatsApp ignore les images en chemin relatif :
         %SITE_URL% est remplacé au build par l'adresse publique du site (voir vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DSL Air Cargo" />
    <meta property="og:title" content="DSL Air Cargo — Fret aérien et maritime Chine-Guinée" />
    <meta
      property="og:description"
      content="Gérez vos expéditions de Guangzhou à Conakry en temps réel. Suivi WhatsApp, tarif fixe et transparent au kilo et zéro frais cachés."
    />
    <meta property="og:image" content="%SITE_URL%/images/og-dsl.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Avion cargo au crépuscule — DSL Air Cargo, de Guangzhou à Conakry" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DSL Air Cargo — Fret aérien et maritime Chine-Guinée" />
    <meta
      name="twitter:description"
      content="Gérez vos expéditions de Guangzhou à Conakry en temps réel. Suivi WhatsApp, tarif fixe et transparent au kilo et zéro frais cachés."
    />
    <meta name="twitter:image" content="%SITE_URL%/images/og-dsl.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
